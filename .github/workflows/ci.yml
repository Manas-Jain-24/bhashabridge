name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt -c backend/requirements-production.txt ruff==0.17.6
      - run: ruff check --select E9,F63,F7,F82 backend scripts ml
      - run: >
          ruff format --check backend/app/core/http.py
          backend/app/services/translation/model_snapshot.py backend/tests/test_production_security.py
          backend/tests/test_postgres_integration.py scripts/issue_invitation.py scripts/test_production_stack.py
      - run: python -m pytest backend/tests -q
      - run: python scripts/check_corpus_leakage.py
      - run: python scripts/check_expanded_data.py
      - run: python scripts/check_language_readiness.py
      - run: python scripts/prepare_translation_quality.py --audit
      - run: python scripts/prepare_translation_quality_v2.py --audit
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r backend/requirements-production.txt
        working-directory: .
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e -- journeys.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: browser-failure-evidence
          path: output/playwright/ci-*
          retention-days: 7
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium --only-shell
        working-directory: frontend
      - run: python scripts/test_production_stack.py --browser
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_USER: bb_test
          POSTGRES_PASSWORD: local-ci-fixture
          POSTGRES_DB: bb_test
        ports: ["5432/tcp"]
        options: >-
          --health-cmd "pg_isready -U bb_test -d bb_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r backend/requirements-production.txt
      - run: pip install -r backend/requirements-dev.txt -c backend/requirements-production.txt
      - run: python -m pytest backend/tests/test_postgres_integration.py -q
        env:
          BB_TEST_POSTGRES_URL: postgresql+psycopg://bb_test:local-ci-fixture@127.0.0.1:${{ job.services.postgres.ports[5432] }}/bb_test
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: pip install pip-audit==2.10.0
      - run: pip-audit --require-hashes -r backend/requirements-production.txt
      - run: npm audit --audit-level=high
        working-directory: frontend
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
