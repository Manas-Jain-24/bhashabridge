name: Optional live provider smoke
on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: 'Maximum Gemini calls (1–6); no retries'
        required: true
        default: '3'
permissions:
  contents: read
concurrency:
  group: live-provider-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r backend/requirements-production.txt
      - name: Run bounded provider probe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_CALLS: ${{ inputs.max_calls }}
        run: python scripts/live_provider_smoke.py --max-calls "$MAX_CALLS" --output output/live-provider-smoke.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: live-provider-smoke
          path: output/live-provider-smoke.json
          retention-days: 14
