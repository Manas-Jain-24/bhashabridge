services:
  postgres:
    image: postgres:16-alpine
    container_name: bhashabridge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhasha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhasha_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bhashabridge}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhasha_user} -d ${POSTGRES_DB:-bhashabridge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bhashabridge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
